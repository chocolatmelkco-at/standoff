<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2-Player Local Duel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%;
      background: #111; color: #fff;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      touch-action: none;
    }
    #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
    #scoreboard {
      height: 40px; display: flex; justify-content: space-around; align-items: center;
      background: #181818; font-size: 16px; font-weight: bold; border-bottom: 2px solid #333;
    }
    #canvas-wrapper { flex: 1; position: relative; width: 100%; }
    canvas { display: block; width: 100%; height: 100%; background: #1a1a1a; }
    .mobile-controls {
      position: absolute; bottom: 10px; width: 100%;
      display: flex; justify-content: space-between; padding: 0 10px; pointer-events: none;
    }
    .control-group { display: flex; gap: 4px; pointer-events: auto; }
    .btn {
      width: 44px; height: 44px; background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
      color: #fff; font-size: 14px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; touch-action: manipulation;
    }
    .btn:active { background: rgba(255, 255, 255, 0.5); }
    .btn-shoot { border-radius: 10px; width: 55px; }
    .p1-color { color: #4da6ff; }
    .p2-color { color: #ff4d4d; }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="scoreboard">
      <div class="p1-color">P1 (Blue) HP: <span id="p1Hp">100</span> | Score: <span id="p1Score">0</span></div>
      <div class="p2-color">P2 (Red) HP: <span id="p2Hp">100</span> | Score: <span id="p2Score">0</span></div>
    </div>

    <div id="canvas-wrapper">
      <canvas id="gameCanvas"></canvas>

      <div class="mobile-controls">
        <div class="control-group">
          <div class="btn" id="btn-p1-left">◄</div>
          <div class="btn" id="btn-p1-right">►</div>
          <div class="btn" id="btn-p1-jump">▲</div>
          <div class="btn" id="btn-p1-duck">▼</div>
          <div class="btn btn-shoot p1-color" id="btn-p1-shoot" style="border-color:#4da6ff;">FIRE (E)</div>
        </div>
        <div class="control-group">
          <div class="btn btn-shoot p2-color" id="btn-p2-shoot" style="border-color:#ff4d4d;">FIRE (SPC)</div>
          <div class="btn" id="btn-p2-duck">▼</div>
          <div class="btn" id="btn-p2-jump">▲</div>
          <div class="btn" id="btn-p2-left">◄</div>
          <div class="btn" id="btn-p2-right">►</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvas-wrapper');

    const V_WIDTH = 800;
    const V_HEIGHT = 450;
    const GROUND_Y = V_HEIGHT - 30;
    const GRAVITY = 0.6;

    function resizeCanvas() {
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const input = {
      p1Left: false, p1Right: false, p1Jump: false, p1Duck: false, p1Shoot: false,
      p2Left: false, p2Right: false, p2Jump: false, p2Duck: false, p2Shoot: false
    };

    const standingHeight = 60;
    const duckingHeight = 30;

    const player1 = {
      id: 1, x: 50, y: GROUND_Y - standingHeight, vx: 0, vy: 0,
      width: 25, height: standingHeight, color: '#4da6ff',
      score: 0, hp: 100, isGrounded: true, isDucking: false, lastShot: 0
    };

    const player2 = {
      id: 2, x: V_WIDTH - 75, y: GROUND_Y - standingHeight, vx: 0, vy: 0,
      width: 25, height: standingHeight, color: '#ff4d4d',
      score: 0, hp: 100, isGrounded: true, isDucking: false, lastShot: 0
    };

    let bullets = [];
    let obstacles = [];
    let activeRagdoll = null;
    let roundOverTimer = 0;
    const FIRE_RATE = 250;

    function generateObstacles() {
      obstacles = [
        { x: 270, y: GROUND_Y - 110, width: 30, height: 80, vy: 1.2, minY: 100, maxY: GROUND_Y - 80, hp: 15 },
        { x: 385, y: GROUND_Y - 150, width: 30, height: 100, vy: -1.5, minY: 80, maxY: GROUND_Y - 100, hp: 15 },
        { x: 500, y: GROUND_Y - 100, width: 30, height: 75, vy: 1.4, minY: 120, maxY: GROUND_Y - 75, hp: 15 }
      ];
    }

    // Keyboard Listeners
    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyS', 'KeyA', 'KeyD', 'KeyE'].includes(e.code)) {
        e.preventDefault();
      }
      
      // Player 1 (A/D/W/S + E)
      if (e.code === 'KeyA') input.p1Left = true;
      if (e.code === 'KeyD') input.p1Right = true;
      if (e.code === 'KeyW') input.p1Jump = true;
      if (e.code === 'KeyS') input.p1Duck = true;
      if (e.code === 'KeyE') input.p1Shoot = true;

      // Player 2 (Arrows + Space)
      if (e.code === 'ArrowLeft') input.p2Left = true;
      if (e.code === 'ArrowRight') input.p2Right = true;
      if (e.code === 'ArrowUp') input.p2Jump = true;
      if (e.code === 'ArrowDown') input.p2Duck = true;
      if (e.code === 'Space') input.p2Shoot = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyA') input.p1Left = false;
      if (e.code === 'KeyD') input.p1Right = false;
      if (e.code === 'KeyW') input.p1Jump = false;
      if (e.code === 'KeyS') input.p1Duck = false;
      if (e.code === 'KeyE') input.p1Shoot = false;

      if (e.code === 'ArrowLeft') input.p2Left = false;
      if (e.code === 'ArrowRight') input.p2Right = false;
      if (e.code === 'ArrowUp') input.p2Jump = false;
      if (e.code === 'ArrowDown') input.p2Duck = false;
      if (e.code === 'Space') input.p2Shoot = false;
    });

    function bindTouch(elementId, actionKey) {
      const btn = document.getElementById(elementId);
      if (!btn) return;
      const start = (e) => { e.preventDefault(); input[actionKey] = true; };
      const end = (e) => { e.preventDefault(); input[actionKey] = false; };
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
    }

    bindTouch('btn-p1-left', 'p1Left');
    bindTouch('btn-p1-right', 'p1Right');
    bindTouch('btn-p1-jump', 'p1Jump');
    bindTouch('btn-p1-duck', 'p1Duck');
    bindTouch('btn-p1-shoot', 'p1Shoot');
    bindTouch('btn-p2-left', 'p2Left');
    bindTouch('btn-p2-right', 'p2Right');
    bindTouch('btn-p2-jump', 'p2Jump');
    bindTouch('btn-p2-duck', 'p2Duck');
    bindTouch('btn-p2-shoot', 'p2Shoot');

    function triggerRagdoll(p, dir) {
      const headX = p.x + p.width / 2;
      const headY = p.y + 10;
      activeRagdoll = {
        color: p.color,
        head: { x: headX, y: headY, vx: dir * 6, vy: -5, r: 8 },
        torso: { x: headX, y: headY + 20, vx: dir * 4, vy: -3, r: 6 },
        lHand: { x: headX - 15, y: headY + 15, vx: dir * 2 - 2, vy: -6, r: 4 },
        rHand: { x: headX + 15, y: headY + 15, vx: dir * 7 + 2, vy: -4, r: 4 },
        lFoot: { x: headX - 10, y: headY + 45, vx: dir * 3, vy: -2, r: 4 },
        rFoot: { x: headX + 10, y: headY + 45, vx: dir * 5, vy: -3, r: 4 }
      };
    }

    function updateRagdoll() {
      if (!activeRagdoll) return;
      const parts = [activeRagdoll.head, activeRagdoll.torso, activeRagdoll.lHand, activeRagdoll.rHand, activeRagdoll.lFoot, activeRagdoll.rFoot];
      
      parts.forEach(pt => {
        pt.vy += GRAVITY;
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vx *= 0.97;

        if (pt.y >= GROUND_Y - pt.r) {
          pt.y = GROUND_Y - pt.r;
          pt.vy = -pt.vy * 0.3;
          pt.vx *= 0.7;
        }
      });
    }

    function updatePlayer(p, isLeft, isRight, isJump, isDuck, isShoot, direction, minX, maxX) {
      if (p.hp <= 0) return;

      // Free Left/Right Movement
      if (isLeft) p.vx = -4.5;
      else if (isRight) p.vx = 4.5;
      else p.vx = 0;

      p.x += p.vx;
      if (p.x < minX) p.x = minX;
      if (p.x > maxX - p.width) p.x = maxX - p.width;

      // Ducking Logic
      if (isDuck && p.isGrounded) {
        if (!p.isDucking) {
          p.isDucking = true;
          p.height = duckingHeight;
          p.y = GROUND_Y - duckingHeight;
        }
      } else {
        if (p.isDucking) {
          p.isDucking = false;
          p.height = standingHeight;
          p.y = GROUND_Y - standingHeight;
        }
      }

      // Jumping Logic
      if (isJump && p.isGrounded && !p.isDucking) {
        p.vy = -12.5;
        p.isGrounded = false;
      }

      if (!p.isGrounded) {
        p.vy += GRAVITY;
        p.y += p.vy;
        if (p.y >= GROUND_Y - p.height) {
          p.y = GROUND_Y - p.height;
          p.vy = 0;
          p.isGrounded = true;
        }
      }

      // Firing Logic
      if (isShoot) {
        const now = Date.now();
        if (now - p.lastShot > FIRE_RATE) {
          bullets.push({
            x: direction === 1 ? p.x + p.width : p.x - 12,
            y: p.y + (p.isDucking ? 10 : 18),
            width: 12, height: 6,
            speed: 13 * direction,
            color: p.color, owner: p
          });
          p.lastShot = now;
        }
      }
    }

    function resetRound() {
      player1.hp = 100; player2.hp = 100;
      player1.x = 50; player1.y = GROUND_Y - standingHeight;
      player2.x = V_WIDTH - 75; player2.y = GROUND_Y - standingHeight;
      player1.vy = 0; player2.vy = 0;
      bullets = []; activeRagdoll = null; roundOverTimer = 0;
      generateObstacles();
      updateUI();
    }

    function updateUI() {
      document.getElementById('p1Hp').innerText = Math.max(0, player1.hp);
      document.getElementById('p1Score').innerText = player1.score;
      document.getElementById('p2Hp').innerText = Math.max(0, player2.hp);
      document.getElementById('p2Score').innerText = player2.score;
    }

    function update() {
      if (roundOverTimer > 0) {
        roundOverTimer--;
        updateRagdoll();
        if (roundOverTimer <= 0) resetRound();
        return;
      }

      // Move Obstacles
      obstacles.forEach(o => {
        o.y += o.vy;
        if (o.y <= o.minY || o.y >= o.maxY) o.vy = -o.vy;
      });

      // Update Players (P1 plays left half, P2 plays right half)
      updatePlayer(player1, input.p1Left, input.p1Right, input.p1Jump, input.p1Duck, input.p1Shoot, 1, 0, V_WIDTH / 2 - 35);
      updatePlayer(player2, input.p2Left, input.p2Right, input.p2Jump, input.p2Duck, input.p2Shoot, -1, V_WIDTH / 2 + 10, V_WIDTH);

      // Update Bullets & Collisions
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.speed;

        // Obstacle Collisions
        let hitObs = false;
        for (let j = obstacles.length - 1; j >= 0; j--) {
          const o = obstacles[j];
          if (b.x < o.x + o.width && b.x + b.width > o.x && b.y < o.y + o.height && b.y + b.height > o.y) {
            o.hp -= 1;
            if (o.hp <= 0) obstacles.splice(j, 1);
            bullets.splice(i, 1);
            hitObs = true;
            break;
          }
        }
        if (hitObs) continue;

        // Hit Player 1
        if (b.owner !== player1 && player1.hp > 0 &&
            b.x < player1.x + player1.width && b.x + b.width > player1.x &&
            b.y < player1.y + player1.height && b.y + b.height > player1.y) {
          player1.hp -= 20;
          bullets.splice(i, 1);
          updateUI();
          if (player1.hp <= 0) {
            player2.score++;
            triggerRagdoll(player1, -1);
            roundOverTimer = 100;
          }
          continue;
        }

        // Hit Player 2
        if (b.owner !== player2 && player2.hp > 0 &&
            b.x + b.width > player2.x && b.x < player2.x + player2.width &&
            b.y < player2.y + player2.height && b.y + b.height > player2.y) {
          player2.hp -= 20;
          bullets.splice(i, 1);
          updateUI();
          if (player2.hp <= 0) {
            player1.score++;
            triggerRagdoll(player2, 1);
            roundOverTimer = 100;
          }
          continue;
        }

        if (b.x < 0 || b.x > V_WIDTH) bullets.splice(i, 1);
      }
    }

    function drawLimb(p1, p2) {
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const scaleX = canvas.width / V_WIDTH;
      const scaleY = canvas.height / V_HEIGHT;

      ctx.save();
      ctx.scale(scaleX, scaleY);

      // Ground
      ctx.fillStyle = '#2b2b2b';
      ctx.fillRect(0, GROUND_Y, V_WIDTH, V_HEIGHT - GROUND_Y);

      // Center Line
      ctx.strokeStyle = '#333';
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(V_WIDTH / 2, 0); ctx.lineTo(V_WIDTH / 2, GROUND_Y);
      ctx.stroke(); ctx.setLineDash([]);

      // Draw Obstacles
      obstacles.forEach(o => {
        ctx.fillStyle = '#4a5568';
        ctx.fillRect(o.x, o.y, o.width, o.height);
        ctx.strokeStyle = '#718096';
        ctx.lineWidth = 2;
        ctx.strokeRect(o.x, o.y, o.width, o.height);
      });

      // Draw Players
      if (player1.hp > 0) {
        ctx.fillStyle = player1.color;
        ctx.fillRect(player1.x, player1.y, player1.width, player1.height);
      }
      if (player2.hp > 0) {
        ctx.fillStyle = player2.color;
        ctx.fillRect(player2.x, player2.y, player2.width, player2.height);
      }

      // Draw Ragdoll Skeleton
      if (activeRagdoll) {
        const r = activeRagdoll;
        ctx.strokeStyle = r.color;
        ctx.fillStyle = r.color;
        ctx.lineWidth = 4;

        drawLimb(r.head, r.torso);
        drawLimb(r.torso, r.lHand);
        drawLimb(r.torso, r.rHand);
        drawLimb(r.torso, r.lFoot);
        drawLimb(r.torso, r.rFoot);

        ctx.beginPath();
        ctx.arc(r.head.x, r.head.y, r.head.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw Bullets
      bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.width, b.height);
      });

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    generateObstacles();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
